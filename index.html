<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Raleway+Dots&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Comic Neue', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      color: #333;
      text-align: center;
      background-color: #f5f0e1;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        180deg, 
        #f5f0e1 0px,  
        #f5f0e1 39px, 
        #8b4513 40px  
      );
      z-index: -1;
    }

    body::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 60px; 
      right: 60px; 
      border-left: 2px solid #8b4513; 
      border-right: 2px solid #8b4513; 
      z-index: -1;
    }

    h1, h2, h3 {
      font-family: 'Comic Neue', cursive;
      margin-bottom: 15px;
      animation: bounceIn 1s ease forwards;
      color: #8b4513;
    }


    h1 {
      font-family: 'Permanent Marker', sans-serif; 
      font-size: 2.487rem;
      color: #4682B4; 
      text-align: center;
      background-color: rgba(255, 255, 255, 0.5); 
      padding: 10px 20px;
      margin-bottom: 20px;
      border-bottom: 3px dashed #8b4513; 
      line-height: 1.4;
      letter-spacing: 1.5px; 
      position: relative;
    }

    h3 {
      font-family: 'Patrick Hand', sans-serif;
      font-size: 1.6rem;
      color: #dd67b2;
      margin-bottom: 15px;
      padding-bottom: 5px;
      letter-spacing: 0.7px; 
      background-color: rgba(255, 255, 255, 0.3);  
    }


    .container {
      background:  #f5f0e1;
      padding: 2rem;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 700px;
      margin: 1rem;
      border: 5px dashed #8b4513;
      background-size: 200% 200%;
    }

    button {
      background-color: #28a745;
      color: black;
      border: none;
      padding: 15px 30px;
      margin-top: 20px;
      font-size: 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      font-family: 'Comic Neue', sans-serif;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
      opacity: 0.9;
    }

    .options .option-btn {
      transition: transform 0.2s ease, background-color 0.2s ease;
      margin: 15px 0;
      padding: 15px;
      border-radius: 20px;
      font-family: 'Comic Neue', sans-serif;
      font-size: 1rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .options .option-btn:nth-child(1) {
      background-color: #28a746df; 
    }

    .options .option-btn:nth-child(2) {
      background-color: #ffd900df; 
    }

    .options .option-btn:nth-child(3) {
      background-color: #ff4d0cd9; 
    }

    .options .option-btn:nth-child(4) {
      background-color: #00bfffd9; 
    }

    .options .option-btn:hover {
      transform: scale(1.05);
    }

    .hidden {
      display: none;
    }

    #feedback {
      color: #00FF00;
      font-size: 1.2rem;
      animation: pulse 0.5s ease infinite alternate;
      font-weight: bold;
    }

    #final-score {
      font-size: 3rem; 
      font-weight: bold;
      color: #dd67b2; 
      background-color: rgba(255, 255, 255, 0.5);
      padding: 20px;
      border: 3px solid #8b4513;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      animation: scorePop 1s ease forwards;
    }

    #fs {
      font-family: 'Permanent Marker', cursive; 
      font-size: 2.5rem;
      color: #4682B4;
      margin-bottom: 1rem;
      letter-spacing: 1.5px;
    }

    @keyframes scorePop {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }



    .category-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .category-options label {
      background-color: #FFECB3;  
      color: #333;  
      padding: 10px 15px;
      margin: 10px;
      border-radius: 10px;  
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
      font-family: 'Raleway', sans-serif;  
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);  
    }

    .category-options label:hover {
      background-color: #FFCC80;  
      transform: translateY(-2px);  
    }


    #difficulty {
      padding: 12px;
      font-size: 1rem;
      border-radius: 10px;
      margin-bottom: 20px;
      background-color: #FFECB3;
      color: #333;  
      border: 1px solid #a0522d;  
      font-family: 'Raleway', sans-serif;
      width: 100%;  
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);  
    }

    #difficulty:hover {
      background-color: #FFCC80;  
      border-color: #8b4513;  
    }


    #difficulty option {
      background-color: #FFECB3;
      color: #333;
    }


    @keyframes bounceIn {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      50% {
        transform: scale(1.2);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.1);
      }
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 0%;
      }
      50% {
        background-position: 100% 100%;
      }
      100% {
        background-position: 0% 0%;
      }
    }

    #confetti {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      width: 15px;
      height: 15px;
      background-color: #FF0;
      opacity: 0;
      border-radius: 50%;
      animation: fall 2s ease forwards, shake 2s ease-in-out infinite;
    }

    @keyframes fall {
      0% {
        opacity: 1;
        transform: translateY(-100vh) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(100vh) rotate(720deg);
      }
    }

    @keyframes shake {
      0%, 100% {
        transform: translateX(0);
      }
      50% {
        transform: translateX(10px);
      }
    }
    button#startBtn {
      background-color: #28a745;  
      color: white;
      border: 2px solid #22863a;  
      padding: 15px 40px;
      margin-top: 20px;
      font-size: 1.5rem;  
      border-radius: 30px;  
      cursor: pointer;
      font-family: 'Raleway', sans-serif;  
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);  
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    button#startBtn:hover {
      background-color: #2ecc71;  
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);  
      transform: scale(1.05);  
    }

    button#startBtn:active {
      background-color: #22863a; 
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);  
    }

    button#play-again {
      background-color: #28a745;  
      color: white;
      border: 2px solid #22863a;  
      padding: 15px 40px;
      margin-top: 20px;
      font-size: 1.5rem;  
      border-radius: 30px;  
      cursor: pointer;
      font-family: 'Raleway', sans-serif;  
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);  
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    button#play-again:hover {
      background-color: #2ecc71;  
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);  
      transform: scale(1.05);  
    }

    button#play-again:active {
      background-color: #22863a;  
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);  
    }
  </style>
</head>
<body>
  <div class="container" id="welcome">
    <h1>Welcome to the Quiz Game!</h1>

    <!-- Category Selection -->
    <h3>Select Categories:</h3>
    <div class="category-options">
        <label><input type="checkbox" name="category" value="Film & TV"> Film & TV</label>
        <label><input type="checkbox" name="category" value="Music"> Music</label>
        <label><input type="checkbox" name="category" value="History"> History</label>
        <label><input type="checkbox" name="category" value="Science"> Science</label>
        <label><input type="checkbox" name="category" value="Technology"> Technology</label>
        <label><input type="checkbox" name="category" value="Geography"> Geography</label>
        <label><input type="checkbox" name="category" value="Sports"> Sports</label>
        <label><input type="checkbox" name="category" value="Art & Literature"> Art & Literature</label>
        <label><input type="checkbox" name="category" value="General Knowledge"> General Knowledge</label>
        <label><input type="checkbox" name="category" value="Food & Drink"> Food & Drink</label>
        <label><input type="checkbox" name="category" value="Animals"> Animals</label>
        <label><input type="checkbox" name="category" value="Politics"> Politics</label>
    </div>

    <h3>Select Difficulty:</h3>
    <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
    </select>

    <div>
      <button id="startBtn">Start Quiz</button>
    </div>
  </div>

  <div class="container hidden" id="quiz">
    <h2 id="question"></h2>
    <div class="options">
      <button class="option-btn">Option 1</button>
      <button class="option-btn">Option 2</button>
      <button class="option-btn">Option 3</button>
      <button class="option-btn">Option 4</button>
    </div>
    <p id="feedback" class="hidden">Your answer is <span id="answer-result"></span>!</p>
  </div>

  <div class="container hidden" id="result">
    <h2 id="fs">Your Final Score:</h2>
    <p id="final-score"></p>
    <button id="play-again">Play Again</button>
  </div>

  <div id="confetti"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
    const startBtn = document.getElementById('startBtn');
    const playAgainBtn = document.getElementById('play-again');
    const quizContainer = document.getElementById('quiz');
    const welcomeContainer = document.getElementById('welcome');
    const resultContainer = document.getElementById('result');
    const questionElem = document.getElementById('question');
    const optionButtons = document.querySelectorAll('.option-btn');
    const feedbackElem = document.getElementById('feedback');
    const answerResult = document.getElementById('answer-result');
    const finalScoreElem = document.getElementById('final-score');
    const confettiContainer = document.getElementById('confetti'); 
    const categoryInputs = document.querySelectorAll('input[name="category"]');
    const difficultySelect = document.getElementById('difficulty');
    let selectedCategories = [];
    let selectedDifficulty = '';
    let currentQuestion = {};
    let score = 0;
    let questionCount = 0;
    const maxQuestions = 5;

    startBtn.addEventListener('click', startGame);
    playAgainBtn.addEventListener('click', resetGame);
    optionButtons.forEach(btn => btn.addEventListener('click', selectAnswer));

    function startGame() {
      selectedCategories = Array.from(categoryInputs)
        .filter(input => input.checked)
        .map(input => input.value);
      selectedDifficulty = difficultySelect.value;

      score = 0;
      questionCount = 0;
      welcomeContainer.classList.add('hidden');
      resultContainer.classList.add('hidden');
      quizContainer.classList.remove('hidden');
      confettiContainer.innerHTML = ''; 
      nextQuestion();
    }

    function resetGame() {
      welcomeContainer.classList.remove('hidden');
      resultContainer.classList.add('hidden');
      quizContainer.classList.add('hidden');
      confettiContainer.innerHTML = ''; 
    }

    async function nextQuestion() {
      feedbackElem.classList.add('hidden');
      if (questionCount >= maxQuestions) {
        return endGame();
      }

      currentQuestion = await generateQuestion();
      if (!currentQuestion) return endGame(); 

      questionElem.textContent = currentQuestion.question;
      optionButtons.forEach((btn, index) => {
        btn.textContent = currentQuestion.options[index];
      });

      questionCount++;
    }

    function selectAnswer(e) {
      const selectedOption = e.target.textContent;
      const correct = selectedOption === currentQuestion.correctAnswer;

      feedbackElem.classList.remove('hidden');
      if (correct) {
        answerResult.textContent = 'correct';
        score++;
        triggerConfetti(); 
      } else {
        answerResult.textContent = 'incorrect';
      }

      setTimeout(() => {
        nextQuestion();
      }, 1500);
    }

    function endGame() {
      quizContainer.classList.add('hidden');
      resultContainer.classList.remove('hidden');
      finalScoreElem.textContent = `${score} / ${maxQuestions}`;
    }

    async function generateQuestion() {
      try {
        const categoryParam = selectedCategories.length
          ? `&categories=${selectedCategories.join(',')}`
          : '';
        const difficultyParam = selectedDifficulty ? `&difficulty=${selectedDifficulty}` : '';
        const response = await fetch(
          `https://the-trivia-api.com/api/questions?limit=1${categoryParam}${difficultyParam}`
        );
        const data = await response.json();
        const questionData = data[0];

        return {
          question: questionData.question,
          options: [...questionData.incorrectAnswers, questionData.correctAnswer].sort(
            () => Math.random() - 0.5
          ),
          correctAnswer: questionData.correctAnswer
        };
      } catch (error) {
        console.error('Error fetching trivia question:', error);
        return null;
      }
    }

    function triggerConfetti() {
      confettiContainer.innerHTML = ''; 

      const numberOfPieces = 50;
      for (let i = 0; i < numberOfPieces; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.backgroundColor = getRandomColor();
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.top = `${Math.random() * 100}vh`;
        confettiContainer.appendChild(piece);
      }

      
      setTimeout(() => {
        confettiContainer.innerHTML = '';
      }, 2000);
    }

    function getRandomColor() {
      const colors = ['#FF007F', '#FFAB00', '#FF6F61', '#6B5B95', '#D0F0C0'];
      return colors[Math.floor(Math.random() * colors.length)];
    }
  });
  </script>
</body>
</html>
